<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chit Funds</title>
  <meta name="theme-color" content="#1768d1" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />

  <!-- Open connections to the third-party origins early — the Firebase SDK
       (gstatic.com) alone is ~175KB gzipped, so the TLS handshake shouldn't
       wait until firebase.js is actually discovered in the module graph. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/overlays.css" />

  <!-- There's no bundler here, so the browser would otherwise discover this
       whole ES module graph one dependency layer at a time (fetch main.js,
       parse it, fetch what IT imports, parse those, ...). These hints let it
       fetch every same-origin module in parallel from the start instead. -->
  <link rel="modulepreload" href="firebase-config.js" />
  <link rel="modulepreload" href="js/firebase.js" />
  <link rel="modulepreload" href="js/auth.js" />
  <link rel="modulepreload" href="js/events.js" />
  <link rel="modulepreload" href="js/render.js" />
  <link rel="modulepreload" href="js/store.js" />
  <link rel="modulepreload" href="js/router.js" />
  <link rel="modulepreload" href="js/listeners.js" />
  <link rel="modulepreload" href="js/helpers.js" />
  <link rel="modulepreload" href="js/actions/index.js" />
  <link rel="modulepreload" href="js/actions/shared.js" />
  <link rel="modulepreload" href="js/actions/navigation.js" />
  <link rel="modulepreload" href="js/actions/groupCreation.js" />
  <link rel="modulepreload" href="js/actions/members.js" />
  <link rel="modulepreload" href="js/actions/payments.js" />
  <link rel="modulepreload" href="js/actions/handoffs.js" />
  <link rel="modulepreload" href="js/actions/winners/index.js" />
  <link rel="modulepreload" href="js/actions/winners/picker.js" />
  <link rel="modulepreload" href="js/actions/winners/payout.js" />
  <link rel="modulepreload" href="js/actions/adminTransfers.js" />
  <link rel="modulepreload" href="js/finance.js" />
  <link rel="modulepreload" href="js/constants.js" />
  <link rel="modulepreload" href="js/icons.js" />
  <link rel="modulepreload" href="js/views/login.js" />
  <link rel="modulepreload" href="js/views/dashboard.js" />
  <link rel="modulepreload" href="js/views/members.js" />
  <link rel="modulepreload" href="js/views/ledger.js" />
  <link rel="modulepreload" href="js/views/groupDetail/index.js" />
  <link rel="modulepreload" href="js/views/groupDetail/shared.js" />
  <link rel="modulepreload" href="js/views/groupDetail/statsCard.js" />
  <link rel="modulepreload" href="js/views/groupDetail/monthRows/index.js" />
  <link rel="modulepreload" href="js/views/groupDetail/monthRows/shared.js" />
  <link rel="modulepreload" href="js/views/groupDetail/monthRows/closedRow.js" />
  <link rel="modulepreload" href="js/views/groupDetail/monthRows/openRow.js" />
  <link rel="modulepreload" href="js/views/groupDetail/monthRows/upcomingRow.js" />
  <link rel="modulepreload" href="js/views/groupMembers.js" />
  <link rel="modulepreload" href="js/views/memberPayments.js" />
  <link rel="modulepreload" href="js/views/createGroup.js" />
  <link rel="modulepreload" href="js/views/monthDetail/index.js" />
  <link rel="modulepreload" href="js/views/monthDetail/shared.js" />
  <link rel="modulepreload" href="js/views/monthDetail/handoffRequests.js" />
  <link rel="modulepreload" href="js/views/monthDetail/summary.js" />
  <link rel="modulepreload" href="js/views/monthDetail/paymentList.js" />
  <link rel="modulepreload" href="js/views/monthDetail/winner.js" />
  <link rel="modulepreload" href="js/views/monthDetail/payout.js" />
  <link rel="modulepreload" href="js/views/monthDetail/paymentModal.js" />
  <link rel="modulepreload" href="js/views/monthDetail/transferBar.js" />
  <link rel="modulepreload" href="js/views/bottomNav.js" />
  <link rel="modulepreload" href="js/skeleton.js" />
</head>
<body>
  <!-- Mirrors js/skeleton.js's renderBootSkeleton() exactly, so there's no
       visible swap once main.js takes over and starts re-rendering this
       same shape from JS. -->
  <div id="app">
    <div class="screen">
      <div style="padding:20px 20px 4px; display:flex; align-items:center; justify-content:space-between;">
        <div style="display:flex;flex-direction:column;gap:6px;">
          <div class="skeleton" style="width:120px;height:11px;"></div>
          <div class="skeleton" style="width:150px;height:22px;margin-top:2px;"></div>
        </div>
        <div class="skeleton" style="width:36px;height:36px;border-radius:12px;flex-shrink:0;"></div>
      </div>
      <div class="content">
        <div class="skeleton" style="width:100%;height:92px;border-radius:20px;"></div>
        <div style="display:flex;gap:12px;">
          <div class="skeleton" style="width:50%;height:56px;border-radius:14px;"></div>
          <div class="skeleton" style="width:50%;height:56px;border-radius:14px;"></div>
        </div>
        <div class="skeleton" style="width:100%;height:68px;border-radius:16px;"></div>
        <div class="skeleton" style="width:100%;height:68px;border-radius:16px;"></div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
