<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chit Funds</title>
  <meta name="theme-color" content="#146b52" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />

  <!-- Open connections to the third-party origins early — the Firebase SDK
       (gstatic.com) alone is ~175KB gzipped, so the TLS handshake shouldn't
       wait until firebase.js is actually discovered in the module graph. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/overlays.css" />

  <!-- There's no bundler here, so the browser would otherwise discover this
       whole ES module graph one dependency layer at a time (fetch main.js,
       parse it, fetch what IT imports, parse those, ...). These hints let it
       fetch every same-origin module in parallel from the start instead. -->
  <link rel="modulepreload" href="firebase-config.js" />
  <link rel="modulepreload" href="js/firebase.js" />
  <link rel="modulepreload" href="js/auth.js" />
  <link rel="modulepreload" href="js/events.js" />
  <link rel="modulepreload" href="js/render.js" />
  <link rel="modulepreload" href="js/store.js" />
  <link rel="modulepreload" href="js/router.js" />
  <link rel="modulepreload" href="js/listeners.js" />
  <link rel="modulepreload" href="js/helpers.js" />
  <link rel="modulepreload" href="js/actions.js" />
  <link rel="modulepreload" href="js/finance.js" />
  <link rel="modulepreload" href="js/constants.js" />
  <link rel="modulepreload" href="js/icons.js" />
  <link rel="modulepreload" href="js/views/login.js" />
  <link rel="modulepreload" href="js/views/dashboard.js" />
  <link rel="modulepreload" href="js/views/members.js" />
  <link rel="modulepreload" href="js/views/ledger.js" />
  <link rel="modulepreload" href="js/views/groupDetail.js" />
  <link rel="modulepreload" href="js/views/groupMembers.js" />
  <link rel="modulepreload" href="js/views/memberPayments.js" />
  <link rel="modulepreload" href="js/views/createGroup.js" />
  <link rel="modulepreload" href="js/views/monthDetail.js" />
  <link rel="modulepreload" href="js/views/bottomNav.js" />
</head>
<body>
  <div id="app">
    <div class="boot">Loading Chit Funds&hellip;</div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
