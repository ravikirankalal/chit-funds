    <g id="kr"><path d="M0 0C-9-2-11-13-4-19C2-24 11-21 11-14C11-9 6-7 3-10C1-12 2-15 5-14C4-17 0-17-2-15C-5-12-4-7 0-4C2-3 3-1 0 0Z" fill="#e8b04a" fill-opacity=".16" stroke="#e8b04a" stroke-opacity=".6" stroke-width=".9"/><circle cx="5" cy="-14" r="1" fill="#e8b04a" fill-opacity=".7"/></g>
    <g id="ros">
  <g fill="#c3302a" fill-opacity=".28" stroke="#e8b04a" stroke-opacity=".6" stroke-width="1"><g transform="rotate(0.0) scale(0.95)"><use href="#p"/></g><g transform="rotate(30.0) scale(0.95)"><use href="#p"/></g><g transform="rotate(60.0) scale(0.95)"><use href="#p"/></g><g transform="rotate(90.0) scale(0.95)"><use href="#p"/></g><g transform="rotate(120.0) scale(0.95)"><use href="#p"/></g><g transform="rotate(150.0) scale(0.95)"><use href="#p"/></g><g transform="rotate(180.0) scale(0.95)"><use href="#p"/></g><g transform="rotate(210.0) scale(0.95)"><use href="#p"/></g><g transform="rotate(240.0) scale(0.95)"><use href="#p"/></g><g transform="rotate(270.0) scale(0.95)"><use href="#p"/></g><g transform="rotate(300.0) scale(0.95)"><use href="#p"/></g><g transform="rotate(330.0) scale(0.95)"><use href="#p"/></g></g>
