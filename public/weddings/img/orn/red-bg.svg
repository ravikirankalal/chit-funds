  </defs>
  <rect width="120" height="120" fill="#7d1512"/>
  <!-- diagonal lattice -->
  <g fill="none" stroke="#e8b04a" stroke-opacity=".28" stroke-width=".8">
    <path d="M0 0L60 60L120 0M0 120L60 60L120 120"/>
    <path d="M30 0L0 30M90 0L120 30M30 120L0 90M90 120L120 90"/>
    <path d="M60 0L30 30L0 60M60 0L90 30L120 60M60 120L30 90L0 60M60 120L90 90L120 60"/>
