  <use href="#ros" x="0" y="0"/><use href="#ros" x="120" y="0"/><use href="#ros" x="0" y="120"/><use href="#ros" x="120" y="120"/>
  <!-- paisley pairs straddling the tile edges so they join across the seams -->
<g transform="translate(60 0)"><g transform="rotate(180) translate(-8 0)"><use href="#kr"/></g><g transform="rotate(180) translate(8 0) scale(-1 1)"><use href="#kr"/></g></g>
<g transform="translate(60 120)"><g transform="rotate(0) translate(-8 0)"><use href="#kr"/></g><g transform="rotate(0) translate(8 0) scale(-1 1)"><use href="#kr"/></g></g>
<g transform="translate(0 60) rotate(90)"><g transform="rotate(0) translate(-8 0)"><use href="#kr"/></g><g transform="rotate(0) translate(8 0) scale(-1 1)"><use href="#kr"/></g></g>
<g transform="translate(120 60) rotate(90)"><g transform="rotate(180) translate(-8 0)"><use href="#kr"/></g><g transform="rotate(180) translate(8 0) scale(-1 1)"><use href="#kr"/></g></g>
</svg>