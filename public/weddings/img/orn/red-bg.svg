  <g fill="#e8b04a" fill-opacity=".75"><circle cx="5.0" cy="0.0" r=".9"/><circle cx="2.5" cy="4.3" r=".9"/><circle cx="-2.5" cy="4.3" r=".9"/><circle cx="-5.0" cy="0.0" r=".9"/><circle cx="-2.5" cy="-4.3" r=".9"/><circle cx="2.5" cy="-4.3" r=".9"/><circle r="1.6"/></g>
